<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="assets/css/app.css">
    <title>VEAG Foundry</title>
  </head>
  <body class="application-shell">
    <header class="application-header">
      <h1 class="product-title" data-bind="applicationName">VEAG Foundry</h1>
      <p class="application-version" data-bind="version">Version placeholder</p>
      <p class="current-project">Current project placeholder</p>
      <p class="current-milestone" data-bind="currentMilestone">Current milestone placeholder</p>
      <p class="current-ticket" data-bind="currentTicket">Current ticket placeholder</p>
      <div class="user-settings-placeholder">User/settings placeholder</div>
    </header>

    <aside class="application-sidebar">
      <nav class="primary-navigation" aria-label="Primary navigation">
        <ul class="navigation-list">
          <li class="navigation-item">Dashboard</li>
          <li class="navigation-item">Projects</li>
          <li class="navigation-item">Roadmap</li>
          <li class="navigation-item">Architecture</li>
          <li class="navigation-item">Releases</li>
          <li class="navigation-item">Documentation</li>
          <li class="navigation-item">Settings</li>
        </ul>
      </nav>
    </aside>

    <main class="application-main">
      <section class="workspace" aria-label="Workspace"></section>
    </main>

    <footer class="application-footer">
      <div class="status-bar">Status bar placeholder</div>
    </footer>

    <script src="assets/js/app.js" defer></script>
  </body>
</html>
