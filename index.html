<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="assets/css/app.css">
    <title>VEAG Foundry</title>
  </head>
  <body class="application-shell">
    <header class="application-header">

      <div class="product-brand">

    <img
        class="product-logo"
        src="assets/img/logo.png"
        alt="VEAG">

    <div class="product-branding">
        <h1 class="product-title" data-bind="name">Foundry</h1>
        <p class="product-description">Engineering Platform</p>
    </div>

</div>
      

      <div class="user-settings-placeholder">User/settings placeholder</div>
    </header>

    <aside class="application-sidebar">
      <nav class="primary-navigation" aria-label="Primary navigation">
        <ul class="navigation-list">
          <li class="navigation-item">Dashboard</li>
          <li class="navigation-item">Projects</li>
          <li class="navigation-item">Roadmap</li>
          <li class="navigation-item">Architecture</li>
          <li class="navigation-item">Releases</li>
          <li class="navigation-item">Documentation</li>
          <li class="navigation-item">Settings</li>
        </ul>
      </nav>
    </aside>

    <main class="application-main">
      <section class="workspace" aria-label="Workspace">
        <div class="dashboard-grid">
          <section class="dashboard-card">
            <header class="dashboard-card__header">
              Current Project
            </header>

            <div 
                class="dashboard-card__body"
                data-bind="currentProject">
            </div>  
  
          </section>

          <section class="dashboard-card">
            <header class="dashboard-card__header">
              Version
            </header>

            <div
              class="dashboard-card__body"
              data-bind="version">
          </div>
          </section>

          <section class="dashboard-card">
            <header class="dashboard-card__header">
              Sprint
            </header>

            <div
                class="dashboard-card__body"
                data-bind="currentSprint">
            </div>
          </section>

          <section class="dashboard-card">
            <header class="dashboard-card__header">
              Current Ticket
            </header>

            <div
                class="dashboard-card__body"
                data-bind="currentTicket">
            </div>
          </section>

          <section class="dashboard-card development-progress" aria-labelledby="development-progress-title">
            <header class="dashboard-card__header" id="development-progress-title">
              Development Progress
            </header>

            <div class="dashboard-card__body development-progress__body">
              <div class="development-progress__summary">
                <span class="development-progress__percentage" data-bind="developmentProgressPercentage">0%</span>
                <span class="development-progress__tickets" data-bind="developmentProgressTickets">0 / 0 completed tickets</span>
              </div>

              <div
                class="development-progress__track"
                data-development-progress-bar
                role="progressbar"
                aria-label="Development progress"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0">
                <div class="development-progress__indicator"></div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer class="application-footer">
      <div class="status-bar">Status bar placeholder</div>
    </footer>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
